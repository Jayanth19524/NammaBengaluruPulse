server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy RoadTrust API
    location /api/ {
        proxy_pass http://roadtrust:8002/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Keep SSE connections alive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy TripCast API
    location /trip/ {
        proxy_pass http://tripcast:8003/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
