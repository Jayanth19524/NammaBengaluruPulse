[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Small provider-agnostic tool-calling agent loop (OpenRouter / OpenAI-compatible)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[tool.setuptools]
packages = ["agentkit"]
